name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_privacy.py
      - run: python -m compileall -q openfunasr_app.py scripts test_openfunasr.py test_funasr_integration.py
      - run: |
          for file in *.sh scripts/*.sh; do
            bash -n "$file"
          done
      - run: python test_openfunasr.py
        env:
          OPENFUNASR_CONFIG_DIR: .cache/test-config
